<!doctype html>
<html lang="id">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipboard Security Test</title>

<h3>Edge Clipboard Security Test</h3>
<p>Salin teks unik ini: <code>EDGE_HTTPS_TEST_58264</code></p>
<button id="read">Baca clipboard</button>
<pre id="out">Memeriksa akses...</pre>

<script>
const out = document.querySelector("#out");

out.textContent =
  "Origin: " + location.origin +
  "\nSecure context: " + isSecureContext +
  "\nClipboard API: " + !!navigator.clipboard;

async function readClipboard(label) {
  try {
    const text = await navigator.clipboard.readText();
    out.textContent += "\n" + label + ": BERHASIL — " +
      JSON.stringify(text);
  } catch (e) {
    out.textContent += "\n" + label + ": " +
      e.name + " — " + e.message;
  }
}

readClipboard("Otomatis tanpa klik");

document.querySelector("#read").onclick = () =>
  readClipboard("Setelah klik");
</script>
</html>
