<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCT PostMessage Regression Lab — Origin A</title>
  <style>
    body {
      font: 16px system-ui, sans-serif;
      margin: 24px;
      color: #111;
    }
    #status {
      padding: 12px;
      background: #f1f1f1;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f5f5f5;
      padding: 12px;
      min-height: 100px;
    }
    button {
      padding: 10px 14px;
      margin: 4px;
    }
  </style>
</head>
<body>
  <h2>CCT PostMessage Regression Lab — Origin A</h2>
  <p>Origin: <code id="origin"></code></p>
  <p id="status">Waiting for a message channel.</p>
  <button id="clear">Clear log</button>
  <button id="ping" disabled>Send test message</button>
  <pre id="log"></pre>

  <script>
    (() => {
      const status = document.querySelector("#status");
      const logBox = document.querySelector("#log");
      const ping = document.querySelector("#ping");

      document.querySelector("#origin").textContent = location.origin;

      let port = null;

      function log(message) {
        logBox.textContent +=
          new Date().toISOString() + " " + message + "\n";
      }

      document.querySelector("#clear").addEventListener("click", () => {
        logBox.textContent = "";
      });

      ping.addEventListener("click", () => {
        if (!port) {
          log("No MessagePort available.");
          return;
        }

        port.postMessage({
          type: "A_TEST",
          origin: location.origin,
          timestamp: Date.now()
        });

        log("Sent A_TEST through MessagePort.");
      });

      window.addEventListener("message", event => {
        log(
          "WINDOW_MESSAGE origin=" + event.origin +
          " currentOrigin=" + location.origin +
          " ports=" + event.ports.length +
          " data=" + JSON.stringify(event.data)
        );

        if (event.ports.length === 0) {
          return;
        }

        if (port) {
          log("A MessagePort is already attached; ignoring extra port.");
          return;
        }

        port = event.ports[0];

        port.onmessage = messageEvent => {
          log("PORT_MESSAGE " + JSON.stringify(messageEvent.data));
        };

        port.onmessageerror = () => {
          log("PORT_MESSAGE_ERROR");
        };

        port.start();
        ping.disabled = false;
        status.textContent = "MessagePort received and started.";

        port.postMessage({
          type: "A_READY",
          origin: location.origin
        });

        log("Port started; sent A_READY.");
      });

      log("A_READY " + location.origin);
    })();
  </script>
</body>
</html>
