<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Firefox Permission Regression Test</title>
</head>
<body>
  <h3>Firefox Android Permission Test</h3>
  <p>Open Google, then test the camera and microphone prompt.</p>
  <button id="start">Start test</button>
  <pre id="status">Ready</pre>

  <script>
    const status = document.getElementById("status");
    const params = new URLSearchParams(location.search);

    if (params.get("stage") === "permission") {
      status.textContent = "Requesting camera and microphone...";

      navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
      }).then(stream => {
        stream.getTracks().forEach(track => track.stop());
        status.textContent = "Permission granted; tracks stopped.";
      }).catch(error => {
        status.textContent = error.name + ": " + error.message;
      });

      setTimeout(() => {
        location.replace("https://www.google.com/");
      }, 2500);
    }

    document.getElementById("start").onclick = () => {
      const target = window.open("https://www.google.com/", "permissionTest");

      if (!target) {
        status.textContent = "Popup blocked. Allow popups for this test.";
        return;
      }

      status.textContent = "Google opened; preparing permission test.";

      setTimeout(() => {
        target.location.href =
          location.origin + location.pathname + "?stage=permission";
      }, 3000);
    };
  </script>
</body>
</html>
