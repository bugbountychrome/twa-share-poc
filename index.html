<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TWA Share Target Regression Test</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#171717">
  <style>
    body {
      font: 16px system-ui, sans-serif;
      max-width: 680px;
      margin: 40px auto;
      padding: 0 18px;
      background: #111;
      color: #eee;
    }
    section {
      padding: 18px;
      border: 1px solid #444;
      border-radius: 12px;
      margin: 18px 0;
    }
    button, input {
      font: inherit;
      margin-top: 10px;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>TWA Share Target Test</h1>
  <p>Test page for benign synthetic files and share metadata.</p>

  <section>
    <h2>Local file metadata test</h2>
    <input id="files" type="file" multiple>
    <button id="inspect">Inspect selected files</button>
    <pre id="output">No files selected.</pre>
  </section>

  <section>
    <h2>Share endpoint status</h2>
    <p id="status">This static GitHub Pages site does not process POST requests.</p>
  </section>

  <script>
    const input = document.querySelector("#files");
    const output = document.querySelector("#output");

    document.querySelector("#inspect").addEventListener("click", () => {
      output.textContent = JSON.stringify(
        Array.from(input.files, file => ({
          name: file.name,
          type: file.type || "(unknown)",
          size: file.size
        })),
        null,
        2
      );
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        // No service worker is required for this metadata-only test.
      });
    }
  </script>
</body>
</html>
