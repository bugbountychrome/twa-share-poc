<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cross-Origin iframe test</title>
</head>
<body>
  <h3>Origin B — SOP Test</h3>
  <p>Pengujian akses iframe lintas-origin.</p>

  <iframe
    id="target"
    src="http://127.0.0.1:8001/login.html"
    width="350"
    height="180">
  </iframe>

  <script>
    const frame = document.getElementById("target");

    frame.addEventListener("load", () => {
      try {
        const doc = frame.contentWindow.document;
        const email = doc.querySelector("#email").value;
        const password = doc.querySelector("#password").value;

        alert(
          "Email: " + email +
          "\nPassword: " + password
        );
      } catch (error) {
        alert("Cross-origin access blocked: " + error.name);
      }
    });
  </script>
</body>
</html>
